syntax = "proto3";

package wire;

// ──────────────────────────────────────────────────────────────
// HotStuff wire-level message schema
// ──────────────────────────────────────────────────────────────

// Proposal for a new block or view
message Propose {
  uint64 round     = 1;
  uint64 height    = 2;
  bytes  hash      = 3;   // block hash
  bytes  payload   = 4;   // optional extra data (RLP / JSON etc.)
  bytes  proposer  = 5;   // proposer address
}

// Vote from a validator for a proposal
message Vote {
  uint64 round       = 1;
  uint64 height      = 2;
  uint32 voterIndex  = 3;
  bytes  voter       = 4;   // validator address
  bytes  signature   = 5;
}

// Commit notification carrying a quorum certificate
message Commit {
  uint64 round   = 1;
  uint64 height  = 2;
  bytes  qc      = 3;      // marshaled QuorumCert
}

// Aggregated Quorum Certificate
message QuorumCert {
  uint64 height   = 1;
  uint64 round    = 2;
  repeated uint32 signers = 3;
  bytes  aggSig   = 4;
}
